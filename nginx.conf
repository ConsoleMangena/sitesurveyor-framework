server {
    listen 80;
    server_name _ sitesurveyor.tech www.sitesurveyor.tech;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json image/svg+xml font/woff2 application/wasm;

    # Security headers.
    #
    # nginx only inherits `add_header` from a parent block when the child block
    # declares none of its own. Both locations below set Cache-Control, so they
    # must repeat the full header set or the browser silently loses every
    # protection. Keep the two blocks in sync.
    #
    # - CSP: scripts are bundled by Vite (no inline scripts); styles need
    #   'unsafe-inline' because Leaflet and Radix position elements inline and
    #   Tailwind emits inline custom properties. connect-src is broad because
    #   the Supabase project URL comes from build-time configuration and the
    #   Solana RPC/tile hosts are deployment-specific.
    # - HSTS is ignored over plain HTTP and matters when this container sits
    #   behind a TLS-terminating proxy; keep it so the header is passed through.

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; worker-src 'self' blob:; manifest-src 'self'" always;
        try_files $uri =404;
    }

    # SPA Client-Side Routing: fallback all routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; worker-src 'self' blob:; manifest-src 'self'" always;
    }
}
