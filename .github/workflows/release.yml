name: Build & Release

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-web:
    name: Web
    runs-on: ubuntu-latest
    env:
      # Real secrets are used when configured; forks fall back to inert
      # placeholders so the build still runs.
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://test.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'test-anon-key' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: apps/web

      - name: Write frontend .env
        shell: bash
        working-directory: apps/web
        run: |
          set -euo pipefail
          {
            printf 'VITE_SUPABASE_URL=%s\n' "$VITE_SUPABASE_URL"
            printf 'VITE_SUPABASE_ANON_KEY=%s\n' "$VITE_SUPABASE_ANON_KEY"
          } > .env

      - name: Build web app
        working-directory: apps/web
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sitesurveyor-web
          path: apps/web/dist

  release:
    name: Publish GitHub Release
    needs: build-web
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: sitesurveyor-web
          path: apps/web/dist

      - name: Package release asset
        shell: bash
        working-directory: apps/web
        run: zip -r "$GITHUB_WORKSPACE/sitesurveyor-web.zip" dist

      # Replace only the release for this tag, and only after the artifact has
      # built successfully. Older releases are left untouched, so a failed
      # build can no longer wipe release history.
      - name: Replace existing release for this tag
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "$GITHUB_REF_NAME" --yes || true

      - name: Create GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes

      - name: Upload release asset
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" sitesurveyor-web.zip --clobber
