name: Build & Release

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

jobs:
  cleanup-release:
    name: Clean old releases
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete previous releases
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching existing releases..."
          tags=$(gh release list --limit 100 --json tagName -q '.[].tagName')
          if [ -z "$tags" ]; then
            echo "No existing releases to delete."
          else
            for tag in $tags; do
              echo "Deleting release and tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag || true
            done
          fi

      - name: Create GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes

  build:
    name: Desktop (${{ matrix.target || matrix.platform }})
    needs: cleanup-release
    if: ${{ needs.cleanup-release.result == 'success' || needs.cleanup-release.result == 'skipped' }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: macos-14
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: ubuntu-22.04
            target: ""
            args: ""
          - platform: windows-latest
            target: ""
            args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsqlite3-dev

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: apps/web/node_modules
          key: npm-${{ matrix.platform }}-${{ hashFiles('apps/web/package-lock.json') }}
          restore-keys: npm-${{ matrix.platform }}-

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            apps/desktop/target
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ matrix.platform }}-${{ matrix.target || 'default' }}-${{ hashFiles('apps/desktop/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.platform }}-${{ matrix.target || 'default' }}-

      - name: Cache GDAL SDK download
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: apps/desktop/gdal-sdk
          key: gdal-sdk-${{ runner.os }}-${{ hashFiles('scripts/download-gdal.mjs') }}
          restore-keys: gdal-sdk-${{ runner.os }}-

      - name: Prepare Windows GDAL SDK
        if: runner.os == 'Windows'
        shell: bash
        run: node scripts/download-gdal.mjs --if-missing

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps
        working-directory: apps/web

      - name: Write frontend .env
        shell: bash
        working-directory: apps/web
        run: |
          set -euo pipefail
          : "${VITE_SUPABASE_URL:?VITE_SUPABASE_URL secret is not set}"
          : "${VITE_SUPABASE_ANON_KEY:?VITE_SUPABASE_ANON_KEY secret is not set}"
          {
            printf 'VITE_SUPABASE_URL=%s\n' "$VITE_SUPABASE_URL"
            printf 'VITE_SUPABASE_ANON_KEY=%s\n' "$VITE_SUPABASE_ANON_KEY"
          } > .env

      - name: Detect Apple signing secrets
        id: apple
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ -n "$CERT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}

      - name: Build Tauri app (with Apple signing)
        if: runner.os == 'macOS' && steps.apple.outputs.enabled == 'true'
        shell: bash
        working-directory: apps/desktop
        run: npx --prefix ../web tauri build ${{ matrix.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build Tauri app (unsigned)
        if: steps.apple.outputs.enabled != 'true'
        shell: bash
        working-directory: apps/desktop
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            npm run tauri:build:win -- ${{ matrix.args }}
          else
            node ../apps/web/node_modules/@tauri-apps/cli/tauri.js build ${{ matrix.args }}
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GDAL_HOME: ${{ runner.os == 'Windows' && format('{0}/apps/desktop/gdal-sdk', github.workspace) || '' }}

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=()
          case "$RUNNER_OS" in
            macOS)
              files=(apps/desktop/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
              ;;
            Linux)
              files=(apps/desktop/target/release/bundle/deb/*.deb apps/desktop/target/release/bundle/appimage/*.AppImage apps/desktop/target/release/bundle/rpm/*.rpm)
              ;;
            Windows)
              files=(apps/desktop/target/release/bundle/nsis/*.exe apps/desktop/target/release/bundle/msi/*.msi)
              ;;
          esac
          if [ ${#files[@]} -gt 0 ]; then
            echo "Uploading ${#files[@]} asset(s): ${files[*]}"
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            echo "No release assets found; skipping upload."
          fi

  build-mobile:
    name: Mobile (Android via EAS)
    needs: cleanup-release
    if: ${{ needs.cleanup-release.result == 'success' || needs.cleanup-release.result == 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
        working-directory: apps/mobile
      - name: Build Android (production AAB)
        working-directory: apps/mobile
        run: eas build --platform android --profile production --non-interactive
      - name: Upload AAB to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: apps/mobile
        run: |
          url=$(eas build:list --platform android --limit 1 --json --non-interactive | jq -r '.[0].artifacts.buildUrl')
          curl -L -o sitesurveyor.aab "$url"
          gh release upload "$GITHUB_REF_NAME" sitesurveyor.aab --clobber
