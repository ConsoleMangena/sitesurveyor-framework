name: Build & Release

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-web:
    name: Web
    runs-on: ubuntu-latest
    env:
      # Real secrets are used when configured; forks fall back to inert
      # placeholders so the build still runs.
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://test.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'test-anon-key' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/web

      - name: Write frontend .env
        shell: bash
        working-directory: apps/web
        run: |
          set -euo pipefail
          {
            printf 'VITE_SUPABASE_URL=%s\n' "$VITE_SUPABASE_URL"
            printf 'VITE_SUPABASE_ANON_KEY=%s\n' "$VITE_SUPABASE_ANON_KEY"
          } > .env

      - name: Build web app
        working-directory: apps/web
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sitesurveyor-web
          path: apps/web/dist

  build-desktop:
    name: Desktop (${{ matrix.label }})
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            paths: |
              apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
              apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          - os: macos-latest
            label: macos
            paths: |
              apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - os: ubuntu-22.04
            label: linux
            paths: |
              apps/desktop/src-tauri/target/release/bundle/deb/*.deb
              apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://test.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'test-anon-key' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Write frontend .env
        shell: bash
        working-directory: apps/web
        run: |
          set -euo pipefail
          {
            printf 'VITE_SUPABASE_URL=%s\n' "$VITE_SUPABASE_URL"
            printf 'VITE_SUPABASE_ANON_KEY=%s\n' "$VITE_SUPABASE_ANON_KEY"
          } > .env

      # The installers carry the version they were built with, so sync the
      # bundle metadata to the tag instead of shipping a stale 0.1.0 inside
      # every release.
      - name: Sync bundle version with the tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          node -e "
            const fs = require('fs');
            const p = 'apps/desktop/src-tauri/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(p, 'utf8'));
            c.version = process.env.VER;
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\\n');
            const t = 'apps/desktop/src-tauri/Cargo.toml';
            let s = fs.readFileSync(t, 'utf8');
            s = s.replace(/^version = \"[^\"]*\"/m, 'version = \"' + process.env.VER + '\"');
            fs.writeFileSync(t, s);
          "

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # Tauri v2 system dependencies for the Linux build (webkit2gtk 4.1).
      - name: Install Linux system packages
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Build desktop bundles
        run: npm run build --workspace @sitesurveyor/desktop

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.label }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-web, build-desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: sitesurveyor-web
          path: apps/web/dist

      - name: Download desktop installers
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist-desktop
          merge-multiple: false

      - name: Package release asset
        shell: bash
        working-directory: apps/web
        run: zip -r "$GITHUB_WORKSPACE/sitesurveyor-web.zip" dist

      # Replace only the release for this tag, and only after the artifact has
      # built successfully. Older releases are left untouched, so a failed
      # build can no longer wipe release history.
      - name: Replace existing release for this tag
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "$GITHUB_REF_NAME" --yes || true

      - name: Create GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes

      - name: Upload release assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          assets="$(find dist-desktop -type f | tr '\n' ' ')"
          gh release upload "$GITHUB_REF_NAME" sitesurveyor-web.zip $assets --clobber
          gh release view "$GITHUB_REF_NAME" --json assets \
            -q '.assets[].name' 
