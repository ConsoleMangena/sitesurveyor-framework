name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Write apps/web/.env
        # Real secrets are used when present. On forks they fall back to inert
        # placeholders so lint/typecheck/test/build still run; the bundle built
        # here is a CI artifact, not a deployment.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://test.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'test-anon-key' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'VITE_SUPABASE_URL=%s\n' "$VITE_SUPABASE_URL"
            printf 'VITE_SUPABASE_ANON_KEY=%s\n' "$VITE_SUPABASE_ANON_KEY"
          } > .env

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (with coverage thresholds)
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: apps/web/coverage
          if-no-files-found: ignore

      - name: Build
        run: npm run build

  engine:
    name: Engine tests (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/engine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/engine/requirements.txt
            apps/engine/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

  mcp:
    name: MCP server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-gateway/sitesurveyor-mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ai-gateway/sitesurveyor-mcp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  functions:
    name: Edge Function tests (Deno)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test
        run: deno test --allow-env --allow-net supabase/functions/_shared/

  database:
    name: Migrations apply from empty
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned to the version the baseline dump was verified against locally.
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.98.0

      # Every migration is applied to an empty PostgreSQL, in order, starting
      # with the captured base schema. This is the check that was missing when
      # 39 of 80 tables had no `create table` in this repository.
      - name: Apply all migrations to an empty database
        run: supabase start

      - name: Check the schema the app depends on
        shell: bash
        run: |
          set -euo pipefail
          DB=$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -1)
          [ -n "$DB" ] || { echo "no database container"; exit 1; }
          q() { docker exec "$DB" psql -U postgres -d postgres -tAc "$1"; }
          fail() { echo "FAIL: $1"; exit 1; }

          tables=$(q "select count(*) from pg_tables where schemaname='public'")
          views=$(q "select count(*) from pg_views where schemaname='public'")
          policies=$(q "select count(*) from pg_policies where schemaname='public'")
          echo "tables=$tables views=$views policies=$policies"
          [ "$tables" -ge 80 ] || fail "expected at least 80 public tables, got $tables"
          [ "$views" -ge 12 ] || fail "expected at least 12 public views, got $views"
          [ "$policies" -ge 170 ] || fail "expected at least 170 policies, got $policies"

          # Base-schema relations the app queries directly.
          for t in workspaces workspace_members projects assets marketplace_listings                    marketplace_orders professionals project_cad_drawings survey_runs; do
            n=$(q "select count(*) from pg_tables where schemaname='public' and tablename='$t'")
            [ "$n" = "1" ] || fail "missing table $t"
          done

          # Seeded market inventory, so /market has something to render.
          listings=$(q "select count(*) from public.public_market_listings")
          [ "$listings" -gt 0 ] || fail "public_market_listings is empty after seeding"
          echo "seeded listings=$listings"

          # Functions added by the newest migrations must exist.
          q "select 1 from pg_proc p join pg_namespace n on n.oid=p.pronamespace
             where n.nspname='public' and p.proname='market_listing_payout'" | grep -q 1             || fail "market_listing_payout() missing"
          q "select 1 from pg_proc p join pg_namespace n on n.oid=p.pronamespace
             where n.nspname='public' and p.proname='sample_market_item_keys'" | grep -q 1             || fail "sample_market_item_keys() missing"

      # The order-status guard is the only thing standing between a browser and
      # a self-declared "paid". Prove it still fires on a freshly built schema.
      - name: Payment status cannot be self-declared
        shell: bash
        run: |
          set -euo pipefail
          DB=$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -1)
          q() { docker exec "$DB" psql -U postgres -d postgres -tAc "$1"; }

          order_id=$(q "with ins as (
              insert into public.marketplace_orders
                (listing_id, listing_workspace_id, buyer_workspace_id, amount, currency, provider, payment_status)
              values ('e2000000-0000-4000-8000-000000000001','e0000000-0000-4000-8000-000000000001',
                      'e0000000-0000-4000-8000-000000000001',10,'USDC','solana','pending')
              returning id
            ) select id from ins" | tr -d '[:space:]')
          case "$order_id" in
            *[!0-9a-f-]*|'') echo "FAIL: could not create a pending order (got '$order_id')"; exit 1 ;;
          esac
          echo "order=$order_id"

          # RLS is disabled for this transaction only so the test exercises the
          # trigger rather than the policy that would otherwise filter the row.
          out=$(docker exec "$DB" psql -U postgres -d postgres -v ON_ERROR_STOP=0 -c             "begin; alter table public.marketplace_orders disable row level security;
             set local role authenticated;
             update public.marketplace_orders set payment_status='completed' where id='$order_id';
             rollback;" 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "Payments are confirmed from the transaction"             || { echo "FAIL: a client could mark its own order completed"; exit 1; }

          status=$(q "select public.market_order_attach_signature('$order_id','5sig')" | tr -d '[:space:]')
          [ "$status" = "submitted" ] || { echo "FAIL: attach signature returned '$status'"; exit 1; }
          echo "signature attached -> $status"

      - name: Stop the local stack
        if: always()
        run: supabase stop --no-backup

  ai-eval:
    name: AI deterministic checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # These four harnesses are deterministic and never call the model, so
      # they run without an NVIDIA key. `npm run ai:eval` is intentionally
      # excluded: it calls the real model and needs NVIDIA_API_KEY.
      - name: Skills
        run: npm run ai:skills-check

      - name: Memory
        run: npm run ai:memory-check

      - name: Models
        run: npm run ai:models-check

      - name: Tool rounds
        run: npm run ai:rounds-check

  # ── Render deploy ──────────────────────────────────────────────────────────
  # Triggers both services (web static site + engine worker) only after all
  # checks pass. Requires two repository secrets:
  #
  #   RENDER_DEPLOY_HOOK_WEB     — Deploy hook URL for sitesurveyor-web
  #   RENDER_DEPLOY_HOOK_ENGINE  — Deploy hook URL for sitesurveyor-engine
  #
  # To get these URLs: Render Dashboard → each service → Settings → Deploy Hook.
  # If the secrets are not set the step is silently skipped, so the workflow
  # stays green on forks and during initial setup.
  deploy:
    name: Deploy to Render
    needs: [web, engine, mcp, functions, ai-eval]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Set at job level so the step `if` conditions below can read them through
    # the `env` context (a step's own `env` is not visible to its `if`).
    env:
      RENDER_DEPLOY_HOOK_WEB: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
      RENDER_DEPLOY_HOOK_ENGINE: ${{ secrets.RENDER_DEPLOY_HOOK_ENGINE }}
    steps:
      - name: Deploy web static site
        if: env.RENDER_DEPLOY_HOOK_WEB != ''
        run: curl -fsS "$RENDER_DEPLOY_HOOK_WEB"

      - name: Deploy engine worker
        if: env.RENDER_DEPLOY_HOOK_ENGINE != ''
        run: curl -fsS "$RENDER_DEPLOY_HOOK_ENGINE"
