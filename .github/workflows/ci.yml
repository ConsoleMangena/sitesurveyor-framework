name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Write apps/web/.env from secrets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          : "${VITE_SUPABASE_URL:?VITE_SUPABASE_URL secret is not set}"
          : "${VITE_SUPABASE_ANON_KEY:?VITE_SUPABASE_ANON_KEY secret is not set}"
          {
            printf 'VITE_SUPABASE_URL=%s\n' "$VITE_SUPABASE_URL"
            printf 'VITE_SUPABASE_ANON_KEY=%s\n' "$VITE_SUPABASE_ANON_KEY"
          } > .env

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  # ── Render deploy ──────────────────────────────────────────────────────────
  # Triggers both services (web static site + engine worker) only after all
  # checks pass. Requires two repository secrets:
  #
  #   RENDER_DEPLOY_HOOK_WEB     — Deploy hook URL for sitesurveyor-web
  #   RENDER_DEPLOY_HOOK_ENGINE  — Deploy hook URL for sitesurveyor-engine
  #
  # To get these URLs: Render Dashboard → each service → Settings → Deploy Hook.
  # If the secrets are not set the step is silently skipped, so the workflow
  # stays green on forks and during initial setup.
  deploy:
    name: Deploy to Render
    needs: web
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy web static site
        if: env.RENDER_DEPLOY_HOOK_WEB != ''
        env:
          RENDER_DEPLOY_HOOK_WEB: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
        run: curl -sS "$RENDER_DEPLOY_HOOK_WEB"

      - name: Deploy engine worker
        if: env.RENDER_DEPLOY_HOOK_ENGINE != ''
        env:
          RENDER_DEPLOY_HOOK_ENGINE: ${{ secrets.RENDER_DEPLOY_HOOK_ENGINE }}
        run: curl -sS "$RENDER_DEPLOY_HOOK_ENGINE"
