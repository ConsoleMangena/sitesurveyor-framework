name: Secret scan

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    # A full-history scan even when nobody pushes: a key that was committed and
    # then deleted is still in the history and still in the published
    # repository.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  # Lets the action comment the finding on a pull request from this repository;
  # pull requests from forks stay read-only, so the job summary is the fallback.
  pull-requests: write

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Needed for the scheduled/manual full-history scan and for the
          # commit range a pull request compares.
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin the binary so a new default cannot change what the gate means.
          GITLEAKS_VERSION: "8.30.1"
