# ==============================================================================
# SiteSurveyor AI — Standalone engine blueprint (kept for reference)
# ==============================================================================
# The root render.yaml now includes both the web static site and this worker in a
# single unified blueprint. Use that one when connecting the repository to Render.
#
# This file is kept so the engine can still be deployed independently if needed
# (e.g. during development, or if the web app is hosted elsewhere).
#
# To deploy this service alone:
#   render blueprint apply --file apps/engine/render.yaml
services:
  - type: worker
    name: sitesurveyor-engine
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    autoDeploy: true
    disk:
      name: sitesurveyor-state
      mountPath: /app/state
      sizeGB: 1
    envVars:
      - key: SITESURVEYOR_STATE_DIR
        value: /app/state
      - key: GDAL_DISABLE_READDIR_ON_OPEN
        value: "EMPTY_DIR"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DE_AFRICA_TOKEN
        sync: false
