<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:ital,opsz,wght@0,14..32,400..800;1,14..32,400..800&family=Manrope:wght@400..800&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="light dark" />
    <!--
      The head below is the fallback for crawlers that do not run the app.
      At build time this block is rewritten from the route table, so the
      title, the share card and the canonical address here always match the
      landing page the app itself renders.
    -->
    <!-- seo-head:start -->
    <meta name="description" content="One open workspace that runs a survey job from quote to cash, with the crew, site files and evidence connected throughout." />
    <meta property="og:title" content="SiteSurveyor" />
    <meta property="og:description" content="One open workspace that runs a survey job from quote to cash, with the crew, site files and evidence connected throughout." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <title>SiteSurveyor</title>
    <!-- seo-head:end -->
    <script>
      // Pre-render theme to avoid FOUC: load the persisted choice, falling back
      // to the OS preference on first visit.
      (function () {
        try {
          var key = "sitesurveyor-theme";
          var stored = null;
          try { stored = localStorage.getItem(key); } catch (e) {}
          var dark = stored === "dark";
          var root = document.documentElement;
          root.classList.toggle("dark", dark);
          root.setAttribute("data-theme", dark ? "dark" : "light");
          root.style.colorScheme = dark ? "dark" : "light";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#1e293b" : "#0f172a");

          // Same treatment for the UI typeface: the choice lives in a `font`
          // cookie and the class must exist before the first paint, or Manrope
          // users get an Inter flash. Unknown values fall back to the default.
          var font = "inter";
          try {
            var match = document.cookie.match(/(?:^|; )font=([^;]*)/);
            var saved = match ? decodeURIComponent(match[1]) : "";
            if (saved === "manrope" || saved === "system") font = saved;
          } catch (e) {}
          root.classList.add("font-" + font);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!--
      THESIS: SiteSurveyor becomes shadcn-admin's console — slate structure, one
      brand red as the accent — refusing the bespoke dark console and the
      one-off card shells that used to run this app.
      OWN-WORLD: shadcn-admin (satnaing) tokens and primitives. Neutral slate
      surfaces, crisp 1px borders, 10px radius, no decorative shadows; brand
      red #d92d20 for primary actions, live state and market highlights.
      STORY: a surveyor runs the job — quote, dispatch, capture, invoice, get
      paid — and the same workspace publishes into the market.
      FIRST VIEWPORT: collapsible slate sidebar with grouped nav (Work, Finance,
      People), sticky header with search, notifications and the user menu; the
      page opens on a KPI row of flat cards, then the work list. Public market
      opens on its map; auth opens on the field-plot sheet below.
      FORM: pinned by brief — shadcn-admin (satnaing) template; seed
      shadcn-admin-migration-2026-11.
      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, and DESIGN.md
    -->
    <!--
      AUTH SURFACE CONTRACT — extends the world above; direction pinned by the
      user's answer (anchoring ledger on the plate), so no concept roll ran.
      THESIS: signing in is a sheet from a surveyor's office, not a login card —
      and the plate on it is the run this product really performs: a file cut
      into chunks, each hashed, one Memo v3 sealing the manifest into a block.
      OWN-WORLD: shadcn-admin slate tokens and primitives on a drafting sheet —
      double neat line, coordinate grid, ruled schedule, mono title block,
      benchmark and tie line; 1px rules and hairline dividers, brand red only
      for the primary action and the one sealed block.
      STORY: the surveyor is the signer. The assistant has no chain tools, so
      the plate shows the operation a wallet authorises, never a bot doing it.
      FIRST VIEWPORT: an 1180px sheet centred on the gridded board, split 44/56;
      left = source object, split, the chunk schedule with its per-chunk
      SHA-256, manifest.json, one benchmarked block with slot and signature tied
      back to the file, over a Version/Chunks/Cluster/SHA-256 block and the memo
      itself; right = escape bar, wordmark, one heading rule, the form, footer
      link.
      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, and DESIGN.md
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
