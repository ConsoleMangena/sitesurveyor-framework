<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..800;1,14..32,400..800&family=Manrope:wght@400..800&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="SiteSurveyor — multi-tenant survey operations platform for projects, dispatch, assets, quotes, and invoicing." />
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="light dark" />
    <meta property="og:title" content="SiteSurveyor" />
    <meta property="og:description" content="Multi-tenant survey operations platform." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <title>SiteSurveyor</title>
    <script>
      // Pre-render theme to avoid FOUC: load the persisted choice, falling back
      // to the OS preference on first visit.
      (function () {
        try {
          var key = "sitesurveyor-theme";
          var stored = null;
          try { stored = localStorage.getItem(key); } catch (e) {}
          var dark = stored === "dark";
          var root = document.documentElement;
          root.classList.toggle("dark", dark);
          root.setAttribute("data-theme", dark ? "dark" : "light");
          root.style.colorScheme = dark ? "dark" : "light";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#1e293b" : "#0f172a");

          // Same treatment for the UI typeface: the choice lives in a `font`
          // cookie and the class must exist before the first paint, or Manrope
          // users get an Inter flash. Unknown values fall back to the default.
          var font = "inter";
          try {
            var match = document.cookie.match(/(?:^|; )font=([^;]*)/);
            var saved = match ? decodeURIComponent(match[1]) : "";
            if (saved === "manrope" || saved === "system") font = saved;
          } catch (e) {}
          root.classList.add("font-" + font);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
