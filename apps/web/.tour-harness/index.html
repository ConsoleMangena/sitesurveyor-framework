<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SiteSurveyor — tour harness</title>
    <script>
      window.__tourErrors = []
      window.addEventListener('error', (e) => window.__tourErrors.push(String(e.message)))
      window.addEventListener('unhandledrejection', (e) => window.__tourErrors.push(String(e.reason)))
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
