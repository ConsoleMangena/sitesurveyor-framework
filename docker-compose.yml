services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Required: the build fails if these are unset. Supply them in your
        # shell or a local .env file (see README, "Docker").
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?Set VITE_SUPABASE_URL before running docker compose}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:?Set VITE_SUPABASE_ANON_KEY before running docker compose}
        VITE_SOLANA_CLUSTER: ${VITE_SOLANA_CLUSTER:-devnet}
        VITE_SOLANA_RPC_URL: ${VITE_SOLANA_RPC_URL:-https://api.devnet.solana.com}
        VITE_SOLANA_USDC_MINT: ${VITE_SOLANA_USDC_MINT:-4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU}
        VITE_SOLANA_TREASURY_ADDRESS: ${VITE_SOLANA_TREASURY_ADDRESS:-}
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
