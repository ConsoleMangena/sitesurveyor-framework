<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="SiteSurveyor — multi-tenant survey operations platform for projects, dispatch, assets, quotes, and invoicing." />
    <meta name="theme-color" content="#d92d20" />
    <meta name="color-scheme" content="light dark" />
    <meta property="og:title" content="SiteSurveyor" />
    <meta property="og:description" content="Multi-tenant survey operations platform." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <title>SiteSurveyor</title>
    <script>
      // Pre-render theme to avoid FOUC: load the persisted choice, falling back
      // to the OS preference on first visit.
      (function () {
        try {
          var key = "sitesurveyor-theme";
          var stored = null;
          try { stored = localStorage.getItem(key); } catch (e) {}
          var dark = stored === "dark" ||
            (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.classList.toggle("dark", dark);
          root.setAttribute("data-theme", dark ? "dark" : "light");
          root.style.colorScheme = dark ? "dark" : "light";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#0d0f0e" : "#d92d20");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
